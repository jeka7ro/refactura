<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <title>Factura SPV — Platformă de Facturare HORECA</title>
    <meta
      name="description"
      content="Importă facturi din SmartBill, SPV, Oblio și re-facturează clienților finali cu adaos comercial. Multi-currency, multi-language, multi-country."
    />
    <link rel="icon" type="image/png" href="/logo_icon_spv.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1e3a8a" />
    <link rel="apple-touch-icon" href="/logo_icon_spv.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script type="text/javascript" src="https://embeds.iubenda.com/widgets/d2940833-37bf-4921-a438-49c9da8f99b1.js"></script>
    <script>
      (function() {
        try {
          var color = localStorage.getItem("tenant-theme-color") || localStorage.getItem("app-theme-color");
          if (!color) {
            var theme = localStorage.getItem("app-theme");
            if (theme === "green") color = "#16a34a";
            else if (theme === "teal") color = "#0d9488";
            else if (theme === "purple") color = "#9333ea";
            else if (theme === "coral") color = "#e11d48";
            else if (theme === "slate") color = "#475569";
            else if (theme === "blue") color = "#2563eb";
          }
          if (color) {
            document.documentElement.style.setProperty("--tenant-theme-color", color);
            document.documentElement.style.setProperty("--primary", color);
            document.documentElement.style.setProperty("--sidebar-primary", color);
            document.documentElement.style.setProperty("--color-primary", color);
          }
          var tmpl = localStorage.getItem("invoice-template");
          if (tmpl === "modern") localStorage.setItem("invoice-template", "classic");
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
