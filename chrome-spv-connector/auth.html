<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conectare Stick USB — ANAF SPV</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: #f8fafc;
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        padding: 28px 24px;
        max-width: 380px;
        width: 100%;
        text-align: center;
        box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
        box-sizing: border-box;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
        padding: 8px 14px;
        border-radius: 14px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
      }
      .badge img {
        height: 34px;
        width: auto;
        object-fit: contain;
        display: block;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 16px;
        font-weight: 700;
        color: #0f172a;
        letter-spacing: -0.01em;
      }
      .status {
        margin: 0 0 18px;
        font-size: 13px;
        line-height: 1.45;
        color: #475569;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 9999px;
        background: #f1f5f9;
        color: #334155;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 14px;
      }
      .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid #cbd5e1;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: spv-spin 0.8s linear infinite;
      }
      .note {
        margin: 0;
        font-size: 11.5px;
        color: #64748b;
      }
      @keyframes spv-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="badge">
          <img
            src="https://static.anaf.ro/static/10/Anaf/primapagina/anaf_ro.png"
            onerror="this.onerror=null;this.src='anaf-logo.png';"
            alt="ANAF"
          />
        </div>
        <h1>Conectare Stick USB — ANAF SPV</h1>
        <p class="status">
          Se inițializează conexiunea securizată cu certificatul digital...
        </p>
        <div class="pill">
          <span class="spinner"></span>
          <span>Conexiune securizată ANAF</span>
        </div>
        <p class="note">
          Selectează certificatul în fereastra Chrome și confirmă codul PIN.
        </p>
      </div>
    </div>
  </body>
</html>
